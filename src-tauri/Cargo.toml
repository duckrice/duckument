[package]
name = "freepdfeditor"
version = "1.0.0"
description = "A free PDF editor for signing, filling in and marking up documents"
authors = ["Duckrice"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the library name from clashing with the binary on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "freepdfeditor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
percent-encoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
